preprocessing:
  # POS tags we keep: NN = nouns (components), VB = verbs (leak, fail),
  # JJ = adjectives (severe, low), RB = adverbs (not, slightly)
  keep_pos: [NN, VB, JJ, RB]

features:
  max_features: 5000
  ngram_range: [1, 2]     # single words + word pairs ("oil leak")
  min_df: 1

split:
  test_size: 0.2
  random_state: 42

models:
  naive_bayes:
    alpha: [0.1, 0.2, 0.5, 0.7, 0.9, 1.0]
  logistic_regression:
    C: [0.1, 2.0, 10.0]
  svm:
    C: [0.1, 1.0, 10.0]